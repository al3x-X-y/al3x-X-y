<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 20" width="850" height="20" fill="none">
  <defs>
    <!-- Background Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0" />
      <stop offset="15%" stop-color="#00e5ff" stop-opacity="0.3" />
      <stop offset="35%" stop-color="#00e5ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ff006e" stop-opacity="1" />
      <stop offset="65%" stop-color="#00e5ff" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#00e5ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Glow Line Gradient -->
    <linearGradient id="glowLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0" />
      <stop offset="25%" stop-color="#00e5ff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ff006e" stop-opacity="0.5" />
      <stop offset="75%" stop-color="#00e5ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </linearGradient>

    <!-- Pulse Orb Radial Glow -->
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#ff006e" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </radialGradient>

    <!-- Scanning Trail Gradient -->
    <linearGradient id="pulseTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0" />
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.35" />
      <stop offset="90%" stop-color="#ff006e" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>

    <style>
      .center-marker {
        animation: centerBlink 2s ease-in-out infinite alternate;
      }
      @keyframes centerBlink {
        0% { opacity: 0.5; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Ambient Glow Line (3px) -->
  <line x1="40" y1="10" x2="810" y2="10" stroke="url(#glowLineGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6" />

  <!-- Core Neon Line (1.5px) -->
  <line x1="20" y1="10" x2="830" y2="10" stroke="url(#lineGrad)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Cyberpunk Tech Accents (Diamonds & Ticks) -->
  <!-- Left Side Accents -->
  <rect x="180" y="8.5" width="3" height="3" fill="#00e5ff" opacity="0.6" transform="rotate(45 181.5 10)" />
  <line x1="280" y1="7" x2="280" y2="13" stroke="#00e5ff" stroke-width="1" opacity="0.4" />

  <!-- Center Diamond Hub -->
  <g class="center-marker">
    <polygon points="425,5.5 429.5,10 425,14.5 420.5,10" fill="#ff006e" opacity="0.85" />
    <polygon points="425,7.5 427.5,10 425,12.5 422.5,10" fill="#ffffff" />
  </g>

  <!-- Right Side Accents -->
  <line x1="570" y1="7" x2="570" y2="13" stroke="#00e5ff" stroke-width="1" opacity="0.4" />
  <rect x="670" y="8.5" width="3" height="3" fill="#00e5ff" opacity="0.6" transform="rotate(45 671.5 10)" />

  <!-- Animated Pulse / Laser Scanner Particle -->
  <g>
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="-60 0; 910 0" 
      dur="3s" 
      repeatCount="indefinite" 
      keyTimes="0; 1"
      calcMode="linear"
    />
    
    <!-- Light Trail behind the pulse -->
    <line x1="-35" y1="10" x2="0" y2="10" stroke="url(#pulseTrail)" stroke-width="2" stroke-linecap="round" />

    <!-- Outer Soft Glow -->
    <circle cx="0" cy="10" r="8" fill="url(#pulseGlow)" />
    
    <!-- Vertical Cross Flare -->
    <line x1="0" y1="4" x2="0" y2="16" stroke="#ffffff" stroke-width="1" opacity="0.75" />
    
    <!-- Center Bright Dot -->
    <circle cx="0" cy="10" r="2" fill="#ffffff" />
  </g>
</svg>
