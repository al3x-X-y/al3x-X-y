<svg xmlns="http://www.w3.org/2000/svg" width="480" height="140" viewBox="0 0 480 140">
  <defs>
    <linearGradient id="album-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#ff00ff" />
    </linearGradient>
    <style>
      .bg { fill: #0d1117; stroke: #00e5ff; stroke-width: 1px; rx: 12px; }
      .text-now-playing { fill: #8b949e; font-family: monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
      .text-title { fill: #e0e0e0; font-family: monospace; font-size: 16px; font-weight: bold; }
      .text-artist { fill: #8b949e; font-family: monospace; font-size: 12px; }
      .note { fill: #ffffff; font-size: 24px; font-family: monospace; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect width="478" height="138" x="1" y="1" class="bg" />
  
  <g transform="translate(25, 45)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="4s" repeatCount="indefinite" />
      <rect width="50" height="50" rx="10" fill="url(#album-grad)" />
      <text x="25" y="27" class="note">♫</text>
    </g>
  </g>
  
  <text x="95" y="55" class="text-now-playing">NOW PLAYING</text>
  <text x="95" y="75" class="text-title">lofi beats to code to</text>
  <text x="95" y="95" class="text-artist">late night vibes</text>
  
  <rect x="95" y="110" width="260" height="2" fill="#161b22" rx="1" />
  <rect x="95" y="110" width="0" height="2" fill="#00e5ff" rx="1">
    <animate attributeName="width" from="0" to="260" dur="30s" repeatCount="indefinite" />
  </rect>
  
  <g fill="#00e5ff">
    <rect x="390" y="90" width="4" height="10" rx="2">
      <animate attributeName="height" values="10; 35; 10" dur="0.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="90; 65; 90" dur="0.4s" repeatCount="indefinite" />
    </rect>
    <rect x="397" y="75" width="4" height="25" rx="2">
      <animate attributeName="height" values="25; 15; 25" dur="0.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="75; 85; 75" dur="0.6s" repeatCount="indefinite" />
    </rect>
    <rect x="404" y="85" width="4" height="15" rx="2">
      <animate attributeName="height" values="15; 30; 15" dur="0.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="85; 70; 85" dur="0.5s" repeatCount="indefinite" />
    </rect>
    <rect x="411" y="65" width="4" height="35" rx="2">
      <animate attributeName="height" values="35; 10; 35" dur="0.7s" repeatCount="indefinite" />
      <animate attributeName="y" values="65; 90; 65" dur="0.7s" repeatCount="indefinite" />
    </rect>
    <rect x="418" y="80" width="4" height="20" rx="2">
      <animate attributeName="height" values="20; 25; 20" dur="0.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="80; 75; 80" dur="0.3s" repeatCount="indefinite" />
    </rect>
    <rect x="425" y="90" width="4" height="10" rx="2">
      <animate attributeName="height" values="10; 30; 10" dur="0.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="90; 70; 90" dur="0.8s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
